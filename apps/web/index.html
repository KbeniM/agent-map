<!doctype html>
<html lang="en" data-color-mode="auto" data-light-theme="light" data-dark-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Agent Map</title>
    <script>
      try {
        const theme = JSON.parse(localStorage.getItem("agent-map-preferences") || "{}").state?.theme ?? "system";
        const dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        const root = document.documentElement;
        root.classList.toggle("dark", dark);
        root.dataset.colorMode = dark ? "dark" : "light";
        const high = matchMedia("(prefers-contrast: more)").matches ? "_high_contrast" : "";
        root.dataset.lightTheme = `light${high}`;
        root.dataset.darkTheme = `dark${high}`;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
