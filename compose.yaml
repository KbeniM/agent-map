services:
  bridge:
    build: .
    ports:
      - "4000:4000"
    environment:
      RANCHER_TOKEN: ${RANCHER_TOKEN:?set RANCHER_TOKEN to a long random string}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:4000}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
    volumes:
      - rancher:/data
    restart: unless-stopped

volumes:
  rancher:
