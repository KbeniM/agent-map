services:
  bridge:
    build: .
    ports:
      - "4000:4000"
    environment:
      AGENT_MAP_TOKEN: ${AGENT_MAP_TOKEN:?set AGENT_MAP_TOKEN to a long random string}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:4000}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
    volumes:
      - agent-map:/data
    restart: unless-stopped

volumes:
  agent-map:
